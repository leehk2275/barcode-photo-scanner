<!DOCTYPE html>
<html lang="ko">

<style>
:root{
  --bg:#fff;--subtle:#f6f8fa;--border:#d0d7de;--border-muted:#d8dee4;
  --text:#1f2328;--muted:#656d76;--dim:#8c959f;--blue:#0969da;
  --green:#1a7f37;--green-bg:#dafbe1;--red:#cf222e;--red-bg:#ffebe9;
  --yellow:#9a6700;--yellow-bg:#fff8c5;--shadow:0 1px 0 rgba(31,35,40,.04);
  --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);min-height:100%;font-family:var(--sans)}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:480px;min-height:100dvh;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--subtle);border:1px solid var(--border);border-radius:10px}
.brand-name{font-size:15px;font-weight:700}.brand-sub{margin-top:3px;color:var(--muted);font:9px var(--mono);letter-spacing:1.2px}
.status{flex:0 0 auto;padding:5px 9px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--muted);font:700 10px var(--mono)}
.status.online{color:var(--green);background:var(--green-bg);border-color:#4ac26b}.status.error{color:var(--red);background:var(--red-bg);border-color:#ff8182}
.connection{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #ff8182;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:12px;line-height:1.4}
.connection.show{display:flex}.retry-btn{flex:0 0 auto;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:11px;font-weight:600;cursor:pointer}
.hanger-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.hanger-badge{font-size:13px;font-weight:700;white-space:nowrap}.hanger-progress{color:var(--muted);font-size:11px;text-align:right}.hanger-progress strong{color:var(--text);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.stat-label{color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.8px}.stat-value{margin-top:5px;font-size:24px;font-weight:700}
.scan-card{padding:16px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.scan-title{margin-bottom:10px;font-size:13px;font-weight:700}.scan-input{width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font:600 16px var(--mono);text-align:center;letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(208,215,222,.2)}
.scan-input:focus{border-color:#54aeff;outline:0;box-shadow:0 0 0 3px rgba(9,105,218,.18)}.scan-input:disabled{background:var(--subtle);color:var(--dim);cursor:not-allowed}
.hint{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.5;text-align:center}.hint strong{color:var(--text)}
.hanger-actions{display:grid;grid-template-columns:.85fr 1.25fr 1.45fr;gap:8px}.hanger-action{min-height:50px;padding:10px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-size:12px;font-weight:750;cursor:pointer}
.hanger-action.reset{color:var(--red);border-color:#ff8182}.hanger-action.complete{background:var(--blue);border-color:var(--blue);color:#fff}.hanger-action:disabled{opacity:.45;cursor:not-allowed}
.hanger-message{display:none;margin-top:-4px;padding:8px 10px;border-radius:7px;background:var(--green-bg);color:var(--green);font-size:11px;line-height:1.4}.hanger-message.show{display:block}.hanger-message.error{background:var(--red-bg);color:var(--red)}
.list{flex:1;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.list-head{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-muted);background:var(--subtle);color:var(--muted);font-size:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-muted)}.row:last-child{border-bottom:0}
.code{font:600 12px var(--mono)}.time{margin-top:3px;color:var(--muted);font:10px var(--mono)}
.tag{padding:3px 7px;border:1px solid var(--border);border-radius:999px;background:var(--subtle);color:var(--muted);font:700 9px var(--mono)}
.tag.target{color:var(--yellow);background:var(--yellow-bg);border-color:#d4a72c}.tag.done{color:var(--green);background:var(--green-bg);border-color:#4ac26b}.tag.error{color:var(--red);background:var(--red-bg);border-color:#ff8182}
.empty{padding:40px 20px;color:var(--muted);font-size:12px;text-align:center}.footer-note{padding:4px;color:var(--muted);font-size:10px;text-align:center}
.result-export{padding-top:4px}.result-export-btn{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--blue);border-radius:8px;background:#fff;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer}.result-export-btn:disabled{color:var(--dim);border-color:var(--border);opacity:.55;cursor:not-allowed}.result-export-status{display:none;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.4;text-align:center}.result-export-status.show{display:block}.result-export-status.error{color:var(--red)}
.full-reset{padding-top:4px}.full-reset-btn{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--red);font-size:11px;font-weight:700;cursor:pointer}.full-reset-btn:disabled{color:var(--dim);opacity:.55;cursor:not-allowed}
.modal-bg{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(31,35,40,.4)}.modal-bg.show{display:flex}
.modal{width:min(100%,350px);padding:24px;background:#fff;border:1px solid var(--border);border-top:4px solid #bf8700;border-radius:12px;box-shadow:0 8px 24px rgba(140,149,159,.25);text-align:center}
.warn{font-size:34px}.modal h2{margin:10px 0 6px;font-size:18px}.modal p{color:var(--muted);font-size:13px;line-height:1.55}
.confirm-modal{border-top-color:var(--border)}.confirm-icon{font-size:28px}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.btn-danger{background:var(--red);color:#fff}.btn-warning{background:#1f883d;color:#fff}
.target-code{margin:14px 0;padding:10px;border:1px solid #d4a72c;border-radius:8px;background:var(--yellow-bg);color:var(--yellow);font:700 15px var(--mono)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}.btn{padding:13px 14px;border-radius:6px;border:1px solid rgba(31,35,40,.15);font-size:14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:#1f883d;color:#fff;box-shadow:0 1px 0 rgba(31,35,40,.1)}.btn-primary:hover:not(:disabled){background:#1a7f37}.btn-secondary{background:var(--subtle);color:var(--text);border-color:var(--border)}
.camera-input{display:none}.preview{display:none;margin-top:14px}.preview.show{display:block}.preview img{width:100%;max-height:280px;object-fit:cover;border:1px solid var(--border);border-radius:8px}
.preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.save-status{display:none;margin-top:10px;padding:9px;border-radius:6px;background:var(--subtle);color:var(--muted);font-size:12px;line-height:1.4}.save-status.show{display:block}.save-status.error{background:var(--red-bg);color:var(--red)}
@media (prefers-reduced-motion:no-preference){.modal{animation:modal-in .14s ease-out}@keyframes modal-in{from{transform:translateY(8px);opacity:.7}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div><div class="brand-name">작업 바코드 스캔</div><div class="brand-sub">MARKET IN U · SUPABASE TEST</div></div>
    <div class="status" id="connectionStatus">연결 중</div>
  </header>

  <div class="connection" id="connectionError">
    <span id="connectionErrorText">작업 대상 목록을 불러오지 못했습니다.</span>
    <button class="retry-btn" id="retryBtn" type="button">다시 연결</button>
  </div>

  <section class="hanger-strip" aria-label="현재 행거 진행 상황">
    <div class="hanger-badge" id="hangerBadge">행거 준비 중</div>
    <div class="hanger-progress">현재 <strong><span id="currentHangerCount">0</span>벌</strong> · 누적 <strong><span id="cumulativeCount">0</span>벌</strong></div>
  </section>

  <section class="stats" aria-label="행거 작업 통계">
    <div class="stat"><div class="stat-label">TOTAL</div><div class="stat-value" id="totalCount">0</div></div>
    <div class="stat"><div class="stat-label">TARGET</div><div class="stat-value" id="targetCount">0</div></div>
    <div class="stat"><div class="stat-label">PHOTO</div><div class="stat-value" id="photoCount">0</div></div>
  </section>

  <section class="scan-card">
    <div class="scan-title">바코드를 스캔해주세요</div>
    <input id="scanInput" class="scan-input" lang="en" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="none" placeholder="작업 목록 연결 중" disabled>
    <div class="hint" id="scanHint">테스트 Supabase에서 작업 대상 목록을 불러오고 있습니다.</div>
  </section>

  <section class="hanger-actions" aria-label="행거 작업 제어">
    <button class="hanger-action" id="deleteScanBtn" type="button" disabled>↶ 삭제</button>
    <button class="hanger-action reset" id="resetHangerBtn" type="button" disabled>현재 행거 초기화</button>
    <button class="hanger-action complete" id="completeHangerBtn" type="button" disabled>행거 완료 →</button>
  </section>
  <div class="hanger-message" id="hangerMessage" aria-live="polite"></div>

  <section class="list">
    <div class="list-head"><span>최근 스캔</span><span id="lastCode">-</span></div>
    <div id="rows"><div class="empty">아직 스캔 기록이 없습니다.</div></div>
  </section>
  <section class="result-export" aria-label="작업 결과 다운로드">
    <button class="result-export-btn" id="exportResultBtn" type="button" disabled>결과 엑셀 다운로드</button>
    <div class="result-export-status" id="exportResultStatus" aria-live="polite"></div>
  </section>
  <div class="footer-note" id="footerNote">독립 테스트 서버 연결 · 운영 DB와 분리됨</div>
  <section class="full-reset" aria-label="전체 작업 초기화">
    <button class="full-reset-btn" id="fullResetBtn" type="button" disabled>전체 초기화</button>
  </section>
</main>

<div class="modal-bg" id="targetModal" role="dialog" aria-modal="true" aria-labelledby="targetTitle">
  <div class="modal">
    <div class="warn" aria-hidden="true">⚠️</div>
    <h2 id="targetTitle">작업이 필요한 바코드입니다</h2>
    <p>현재 상품 사진 촬영이 필요한 대상으로 등록되어 있습니다.</p>
    <div class="target-code" id="modalBarcode">-</div>
    <div id="beforePhoto" class="actions">
      <button class="btn btn-primary" id="cameraBtn" type="button">📷 사진 촬영</button>
      <button class="btn btn-secondary" id="laterBtn" type="button">나중에 촬영</button>
    </div>
    <input id="cameraInput" class="camera-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment">
    <div class="preview" id="previewBox">
      <img id="previewImg" alt="촬영 미리보기">
      <div class="save-status" id="saveStatus" aria-live="polite"></div>
      <div class="preview-actions">
        <button class="btn btn-secondary" id="retakeBtn" type="button">다시 촬영</button>
        <button class="btn btn-primary" id="saveBtn" type="button">저장</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal confirm-modal">
    <div class="confirm-icon" aria-hidden="true">↪</div>
    <h2 id="confirmTitle">행거 작업 확인</h2>
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancelBtn" type="button">취소</button>
      <button class="btn btn-warning" id="confirmActionBtn" type="button">확인</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm';

const SUPABASE_URL = 'https://rbifmyvpilvjqfmrfvhr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kjSAGL7Fev9ttgIoJ7B4aQ_tAAALQ7n';
const STORAGE_BUCKET = 'item-photos';
const EXCELJS_MODULE_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/+esm';
const PAGE_SIZE = 1000;
const DEVICE_STORAGE_KEY = 'barcode-photo-scanner-device-id';
const DEVICE_ID = getOrCreateDeviceId();
const INSTANCE_ID = createUuid();
const HANGER_FK_CONSTRAINT = 'hanger_scans_hanger_device_fkey';
const HANGER_SYNC_CHANNEL_NAME = `barcode-photo-scanner-hanger-${DEVICE_ID}`;
const HANGER_SYNC_STORAGE_KEY = `${HANGER_SYNC_CHANNEL_NAME}-event`;
const hangerSyncChannel = typeof BroadcastChannel === 'function' ? new BroadcastChannel(HANGER_SYNC_CHANNEL_NAME) : null;

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  global: { headers: { 'x-device-id': DEVICE_ID } }
});

const $ = id => document.getElementById(id);
const scanInput = $('scanInput');
const targetModal = $('targetModal');
const modalBarcode = $('modalBarcode');
const cameraInput = $('cameraInput');
const cameraBtn = $('cameraBtn');
const laterBtn = $('laterBtn');
const previewBox = $('previewBox');
const previewImg = $('previewImg');
const retakeBtn = $('retakeBtn');
const saveBtn = $('saveBtn');
const beforePhoto = $('beforePhoto');
const rows = $('rows');
const saveStatus = $('saveStatus');
const connectionStatus = $('connectionStatus');
const connectionError = $('connectionError');
const connectionErrorText = $('connectionErrorText');
const retryBtn = $('retryBtn');
const deleteScanBtn = $('deleteScanBtn');
const resetHangerBtn = $('resetHangerBtn');
const completeHangerBtn = $('completeHangerBtn');
const fullResetBtn = $('fullResetBtn');
const exportResultBtn = $('exportResultBtn');
const exportResultStatus = $('exportResultStatus');
const hangerMessage = $('hangerMessage');
const confirmModal = $('confirmModal');
const confirmTitle = $('confirmTitle');
const confirmMessage = $('confirmMessage');
const confirmCancelBtn = $('confirmCancelBtn');
const confirmActionBtn = $('confirmActionBtn');

let logs = [];
let targets = new Map();
let activeHanger = null;
let currentTarget = null;
let currentHangerScanId = null;
let currentFile = null;
let previewUrl = null;
let currentStoragePath = null;
let currentPhotoRecordSaved = false;
let targetListReady = false;
let hangerReady = false;
let isSaving = false;
let isRecordingScan = false;
let isHangerBusy = false;
let isSyncingHanger = false;
let isExporting = false;
let pendingHangerSync = false;
let nextHangerNumber = 1;
let currentHangerCount = 0;
let cumulativeCount = 0;
let currentTargetCount = 0;
let currentPhotoCount = 0;
let confirmResolver = null;
let excelJsPromise = null;

const HANGUL_INITIAL_KEYS = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
const HANGUL_MEDIAL_KEYS = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
const HANGUL_FINAL_KEYS = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
const HANGUL_JAMO_KEYS = new Map(Object.entries({
  'ㄱ':'r','ㄲ':'R','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅄ':'qt','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l'
}));

function hangulKeyboardToLatin(value){
  let result = '';
  for(const char of String(value || '')){
    const code = char.charCodeAt(0);
    if(code >= 0xac00 && code <= 0xd7a3){
      const offset = code - 0xac00;
      result += HANGUL_INITIAL_KEYS[Math.floor(offset / 588)];
      result += HANGUL_MEDIAL_KEYS[Math.floor((offset % 588) / 28)];
      result += HANGUL_FINAL_KEYS[offset % 28];
    }else{
      result += HANGUL_JAMO_KEYS.get(char) || char;
    }
  }
  return result;
}

function normalizeBarcode(value){ return hangulKeyboardToLatin(value).trim().replace(/\s+/g, '').toUpperCase(); }
function formatTime(value=new Date()){ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value)); }
function formatKstDateTime(value){ return value ? new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value)) : ''; }
function formatKstFileDate(value=new Date()){
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value)).filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
  return `${parts.year}.${parts.month}.${parts.day}`;
}
function toKstExcelDate(value){ return value ? new Date(new Date(value).getTime() + 9 * 60 * 60 * 1000) : null; }
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }
function appReady(){ return targetListReady && hangerReady && !isHangerBusy && !isRecordingScan && !isSyncingHanger && !isExporting; }
function refocus(){ if(appReady() && !targetModal.classList.contains('show') && !confirmModal.classList.contains('show')) setTimeout(()=>scanInput.focus(),80); }

function createUuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g,char=>(Number(char)^crypto.getRandomValues(new Uint8Array(1))[0]&(15>>Number(char)/4)).toString(16));
}

function getOrCreateDeviceId(){
  try{
    const stored = localStorage.getItem(DEVICE_STORAGE_KEY);
    if(stored && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(stored)) return stored;
    const created = createUuid();
    localStorage.setItem(DEVICE_STORAGE_KEY,created);
    return created;
  }catch(_error){
    return createUuid();
  }
}

function isStaleHangerError(error){
  return error?.code === '23503'
    && `${error.message || ''} ${error.details || ''}`.includes(HANGER_FK_CONSTRAINT);
}

function isDuplicateScanError(error){
  return error?.code === '23505'
    && `${error.message || ''} ${error.details || ''}`.includes('hanger_scans_device_barcode_key');
}

function createHangerSyncEvent(type){
  return {type,deviceId:DEVICE_ID,sourceId:INSTANCE_ID,createdAt:Date.now()};
}

function broadcastHangerChange(type){
  const event = createHangerSyncEvent(type);
  if(hangerSyncChannel){
    hangerSyncChannel.postMessage(event);
    return;
  }
  try{
    localStorage.setItem(HANGER_SYNC_STORAGE_KEY,JSON.stringify(event));
    localStorage.removeItem(HANGER_SYNC_STORAGE_KEY);
  }catch(_error){ /* 탭 동기화가 불가능해도 DB 검증으로 복구 */ }
}

function shouldAcceptHangerSync(event){
  return event?.deviceId === DEVICE_ID && event?.sourceId !== INSTANCE_ID;
}

function canSynchronizeHangerNow(){
  return !isRecordingScan && !isHangerBusy && !isSaving
    && !targetModal.classList.contains('show')
    && !confirmModal.classList.contains('show');
}

function playWarningTone(){
  try{
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(!AudioContext) return;
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(.08, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .16);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime + .16);
    oscillator.addEventListener('ended',()=>context.close().catch(()=>{}),{once:true});
  }catch(_error){ /* 브라우저 정책상 차단되면 진동만 사용 */ }
}

async function loadAppState(){
  targetListReady = false;
  hangerReady = false;
  scanInput.disabled = true;
  scanInput.placeholder = '작업 상태 연결 중';
  connectionStatus.textContent = '연결 중';
  connectionStatus.className = 'status';
  connectionError.classList.remove('show');
  retryBtn.disabled = true;
  setHangerMessage('',false);
  render();

  try{
    await Promise.all([loadTargetsData(),loadHangerState()]);
    targetListReady = true;
    hangerReady = true;
    scanInput.disabled = false;
    scanInput.placeholder = 'SCAN BARCODE';
    connectionStatus.textContent = 'ONLINE';
    connectionStatus.className = 'status online';
    $('scanHint').innerHTML = `스캔한 바코드는 현재 행거에 자동 저장됩니다.<br><strong>작업 대상 ${targets.size.toLocaleString()}건 연결됨</strong>`;
    $('footerNote').textContent = `테스트 Supabase 연결 · 작업 대상 ${targets.size.toLocaleString()}건 · 운영 DB와 분리됨`;
    render();
    refocus();
  }catch(error){
    console.error('Failed to load app state', error);
    targets = new Map();
    activeHanger = null;
    connectionStatus.textContent = 'ERROR';
    connectionStatus.className = 'status error';
    connectionErrorText.textContent = '작업 대상 또는 행거 진행 상태를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 연결해주세요.';
    connectionError.classList.add('show');
    $('scanHint').textContent = '진행 상태 연결 전에는 누락 방지를 위해 스캔할 수 없습니다.';
    render();
  }finally{
    retryBtn.disabled = false;
  }
}

async function loadTargetsData(){
  const loaded = new Map();
  for(let from = 0; ; from += PAGE_SIZE){
    const { data, error } = await supabase
      .from('photo_targets')
      .select('id,barcode,status,note,created_at,completed_at,completed_at_kst')
      .order('id', { ascending: true })
      .range(from, from + PAGE_SIZE - 1);
    if(error) throw error;
    for(const target of data) loaded.set(normalizeBarcode(target.barcode),target);
    if(data.length < PAGE_SIZE) break;
  }
  targets = loaded;
}

async function loadActiveHanger(){
  const { data: existing, error: existingError } = await supabase
    .from('scan_hangers')
    .select('id,hanger_number,status,created_at')
    .eq('device_id',DEVICE_ID)
    .eq('status','active')
    .order('hanger_number',{ascending:false})
    .limit(1)
    .maybeSingle();
  if(existingError) throw existingError;
  if(existing){
    nextHangerNumber = existing.hanger_number;
    return existing;
  }

  const { data: latest, error: latestError } = await supabase
    .from('scan_hangers')
    .select('hanger_number')
    .eq('device_id',DEVICE_ID)
    .order('hanger_number',{ascending:false})
    .limit(1)
    .maybeSingle();
  if(latestError) throw latestError;
  nextHangerNumber = (latest?.hanger_number || 0)+1;
  return null;
}

async function createActiveHanger(){
  if(activeHanger) return activeHanger;
  const { data: created, error: createError } = await supabase
    .from('scan_hangers')
    .insert({device_id:DEVICE_ID,hanger_number:nextHangerNumber,status:'active'})
    .select('id,hanger_number,status,created_at')
    .single();
  if(createError?.code === '23505'){
    const { data: concurrent, error: concurrentError } = await supabase
      .from('scan_hangers')
      .select('id,hanger_number,status,created_at')
      .eq('device_id',DEVICE_ID)
      .eq('status','active')
      .order('hanger_number',{ascending:false})
      .limit(1)
      .maybeSingle();
    if(concurrentError) throw concurrentError;
    if(concurrent){
      nextHangerNumber = concurrent.hanger_number;
      activeHanger = concurrent;
      return concurrent;
    }
  }
  if(createError) throw createError;
  nextHangerNumber = created.hanger_number;
  activeHanger = created;
  return created;
}

async function loadHangerState(){
  activeHanger = await loadActiveHanger();
  const { count: totalCount, error: totalError } = await supabase
    .from('hanger_scans')
    .select('*',{count:'exact',head:true})
    .eq('device_id',DEVICE_ID);
  if(totalError) throw totalError;
  cumulativeCount = totalCount || 0;

  if(!activeHanger){
    logs = [];
    currentHangerCount = 0;
    currentTargetCount = 0;
    currentPhotoCount = 0;
    return;
  }

  const currentFilter = query=>query.eq('device_id',DEVICE_ID).eq('hanger_id',activeHanger.id);
  const [recent,current,target,photo] = await Promise.all([
    currentFilter(supabase.from('hanger_scans').select('id,barcode,is_target,photo_saved,scanned_at').order('id',{ascending:false}).limit(30)),
    currentFilter(supabase.from('hanger_scans').select('*',{count:'exact',head:true})),
    currentFilter(supabase.from('hanger_scans').select('*',{count:'exact',head:true})).eq('is_target',true),
    currentFilter(supabase.from('hanger_scans').select('*',{count:'exact',head:true})).eq('photo_saved',true)
  ]);
  for(const result of [recent,current,target,photo]) if(result.error) throw result.error;
  logs = recent.data.map(item=>({
    id:item.id,
    barcode:item.barcode,
    isTarget:item.is_target,
    photo:item.photo_saved,
    error:false,
    time:formatTime(item.scanned_at)
  }));
  currentHangerCount = current.count || 0;
  currentTargetCount = target.count || 0;
  currentPhotoCount = photo.count || 0;
}

async function synchronizeHangerState({message='',onlyWhenChanged=false,force=false}={}){
  if(isSyncingHanger) return;
  if(!force && !canSynchronizeHangerNow()){
    pendingHangerSync = true;
    return;
  }

  isSyncingHanger = true;
  pendingHangerSync = false;
  hangerReady = false;
  scanInput.disabled = true;
  renderControls();
  const previousHangerId = activeHanger?.id || null;
  const previousHangerNumber = activeHanger?.hanger_number || nextHangerNumber;
  try{
    await loadHangerState();
    hangerReady = true;
    const changed = previousHangerId !== activeHanger?.id || previousHangerNumber !== (activeHanger?.hanger_number || nextHangerNumber);
    if(message && (!onlyWhenChanged || changed)) setHangerMessage(message,false);
  }catch(error){
    activeHanger = null;
    hangerReady = false;
    console.error('Failed to synchronize hanger state',error);
    connectionErrorText.textContent = '행거 정보를 다시 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 연결해주세요.';
    connectionError.classList.add('show');
    setHangerMessage('행거 연결을 확인할 수 없어 스캔을 잠갔습니다.',true);
  }finally{
    isSyncingHanger = false;
    scanInput.disabled = !appReady();
    render();
    refocus();
  }
}

async function verifyActiveHanger(){
  if(!activeHanger){
    await createActiveHanger();
    return false;
  }

  const { data, error } = await supabase
    .from('scan_hangers')
    .select('id,hanger_number,status,created_at')
    .eq('id',activeHanger.id)
    .eq('device_id',DEVICE_ID)
    .eq('status','active')
    .maybeSingle();
  if(error) throw error;
  if(data){
    activeHanger = data;
    return false;
  }

  await synchronizeHangerState({message:'변경된 행거 정보를 다시 연결했습니다.',force:true});
  if(!activeHanger) await createActiveHanger();
  return true;
}

async function flushPendingHangerSync(){
  if(!pendingHangerSync || !canSynchronizeHangerNow()) return;
  await synchronizeHangerState({message:'다른 창에서 변경된 행거 정보를 반영했습니다.',onlyWhenChanged:true});
}

scanInput.addEventListener('keydown', event=>{
  if(event.key !== 'Enter' || !appReady() || targetModal.classList.contains('show')) return;
  event.preventDefault();
  const barcode = normalizeBarcode(scanInput.value);
  scanInput.value = '';
  if(barcode) handleScan(barcode);
});

async function insertHangerScan(barcode,target,isTarget){
  return supabase
    .from('hanger_scans')
    .insert({
      hanger_id:activeHanger.id,
      device_id:DEVICE_ID,
      barcode,
      target_id:target?.id || null,
      is_target:isTarget,
      photo_saved:false
    })
    .select('id,barcode,is_target,photo_saved,scanned_at')
    .single();
}

async function handleScan(barcode){
  if(isRecordingScan) return;
  isRecordingScan = true;
  scanInput.disabled = true;
  setHangerMessage('',false);
  let target = targets.get(barcode) || null;
  let isTarget = Boolean(target);

  try{
    if(target){
      const { data: latestTarget, error: targetError } = await supabase
        .from('photo_targets')
        .select('id,barcode,status,note,created_at,completed_at,completed_at_kst')
        .eq('id',target.id)
        .maybeSingle();
      if(targetError) throw targetError;
      if(latestTarget){
        target = latestTarget;
        targets.set(barcode,latestTarget);
      }
      if(target?.status === 'completed'){
        await showDuplicateWarning(barcode,'이미 사진 촬영까지 완료된 작업 대상입니다.');
        return;
      }
    }

    let recoveredHanger = await verifyActiveHanger();
    let { data: savedScan, error } = await insertHangerScan(barcode,target,isTarget);
    if(isStaleHangerError(error)){
      setHangerMessage('행거 정보를 다시 연결하고 스캔을 저장하고 있습니다.',false);
      await synchronizeHangerState({force:true});
      if(!activeHanger) throw error;
      ({data:savedScan,error} = await insertHangerScan(barcode,target,isTarget));
      recoveredHanger = true;
    }
    if(isDuplicateScanError(error)){
      await showDuplicateWarning(barcode,'같은 기기의 이전 행거 또는 현재 행거에서 이미 스캔했습니다.');
      return;
    }
    if(error) throw error;

    const entry = {id:savedScan.id,barcode,isTarget,photo:false,error:false,time:formatTime(savedScan.scanned_at)};
    logs.unshift(entry);
    logs = logs.slice(0,30);
    currentHangerCount += 1;
    cumulativeCount += 1;
    if(isTarget) currentTargetCount += 1;
    render();
    if(recoveredHanger) setHangerMessage('행거 정보를 다시 연결하고 스캔을 정상 저장했습니다.',false);

    if(target?.status === 'pending'){
      currentTarget = target;
      currentHangerScanId = savedScan.id;
      modalBarcode.textContent = barcode;
      vibrate([180,80,180]);
      playWarningTone();
      targetModal.classList.add('show');
      renderControls();
    }else{
      vibrate(35);
    }
  }catch(error){
    console.error('Failed to record hanger scan',error);
    if(isDuplicateScanError(error)){
      await showDuplicateWarning(barcode,'같은 기기의 이전 행거 또는 현재 행거에서 이미 스캔했습니다.');
    }else if(isStaleHangerError(error)){
      hangerReady = false;
      setHangerMessage('행거 연결이 변경되어 스캔을 저장하지 못했습니다. 다시 연결을 눌러주세요.',true);
      connectionErrorText.textContent = '행거 정보가 변경되었습니다. 다시 연결하면 안전하게 이어서 스캔할 수 있습니다.';
      connectionError.classList.add('show');
    }else{
      setHangerMessage(`스캔 기록 저장 실패: ${error.message || '다시 시도해주세요.'}`,true);
    }
    vibrate([180,80,180]);
  }finally{
    isRecordingScan = false;
    scanInput.disabled = !appReady() || targetModal.classList.contains('show');
    renderControls();
    refocus();
    await flushPendingHangerSync();
  }
}

async function showDuplicateWarning(barcode,reason){
  setHangerMessage(`${barcode} 중복 스캔이 차단되었습니다.`,true);
  vibrate([180,80,180]);
  playWarningTone();
  await requestConfirmation({
    title:'중복 바코드입니다',
    message:`${barcode}은(는) ${reason} 수량에는 추가하지 않았습니다.`,
    actionLabel:'확인',
    danger:true,
    showCancel:false
  });
}

function requestConfirmation({title,message,actionLabel='확인',danger=false,showCancel=true}){
  if(confirmResolver) return Promise.resolve(false);
  confirmTitle.textContent = title;
  confirmMessage.textContent = message;
  confirmActionBtn.textContent = actionLabel;
  confirmActionBtn.className = `btn ${danger?'btn-danger':'btn-warning'}`;
  confirmCancelBtn.hidden = !showCancel;
  confirmModal.classList.add('show');
  scanInput.disabled = true;
  renderControls();
  return new Promise(resolve=>{ confirmResolver = resolve; });
}

function resolveConfirmation(confirmed){
  if(!confirmResolver) return;
  const resolve = confirmResolver;
  confirmResolver = null;
  confirmModal.classList.remove('show');
  confirmCancelBtn.hidden = false;
  scanInput.disabled = !appReady();
  renderControls();
  resolve(confirmed);
  refocus();
  setTimeout(()=>flushPendingHangerSync(),0);
}

async function runHangerAction(action){
  if(isHangerBusy || !hangerReady || targetModal.classList.contains('show')) return;
  isHangerBusy = true;
  scanInput.disabled = true;
  renderControls();
  try{
    await action();
  }catch(error){
    console.error('Hanger action failed',error);
    setHangerMessage(error.message || '행거 작업 처리에 실패했습니다.',true);
  }finally{
    isHangerBusy = false;
    scanInput.disabled = !appReady();
    render();
    refocus();
    await flushPendingHangerSync();
  }
}

async function deleteLastScan(){
  const last = logs[0];
  if(!last || !activeHanger) return;
  const photoNote = last.photo ? ' 사진과 작업 완료 기록은 유지되고 행거 집계에서만 빠집니다.' : '';
  const confirmed = await requestConfirmation({
    title:'최근 스캔 삭제',
    message:`${last.barcode}을(를) 현재 행거에서 삭제할까요?${photoNote}`,
    actionLabel:'삭제',
    danger:true
  });
  if(!confirmed) return;
  await runHangerAction(async()=>{
    const { error } = await supabase
      .from('hanger_scans')
      .delete()
      .eq('id',last.id)
      .eq('device_id',DEVICE_ID)
      .eq('hanger_id',activeHanger.id);
    if(error) throw error;
    logs.shift();
    currentHangerCount = Math.max(0,currentHangerCount-1);
    cumulativeCount = Math.max(0,cumulativeCount-1);
    if(last.isTarget) currentTargetCount = Math.max(0,currentTargetCount-1);
    if(last.photo) currentPhotoCount = Math.max(0,currentPhotoCount-1);
    setHangerMessage('최근 스캔 1건을 행거에서 삭제했습니다.',false);
    broadcastHangerChange('scan-deleted');
  });
}

async function resetCurrentHanger(){
  if(!activeHanger || currentHangerCount === 0) return;
  const savedNote = currentPhotoCount > 0 ? ' 이미 저장된 사진과 작업 완료 기록은 유지됩니다.' : '';
  const confirmed = await requestConfirmation({
    title:'현재 행거 초기화',
    message:`${activeHanger.hanger_number}번 행거의 스캔 ${currentHangerCount}건을 모두 초기화할까요?${savedNote}`,
    actionLabel:'초기화',
    danger:true
  });
  if(!confirmed) return;
  await runHangerAction(async()=>{
    const removedCount = currentHangerCount;
    const { error } = await supabase
      .from('hanger_scans')
      .delete()
      .eq('device_id',DEVICE_ID)
      .eq('hanger_id',activeHanger.id);
    if(error) throw error;
    logs = [];
    currentHangerCount = 0;
    currentTargetCount = 0;
    currentPhotoCount = 0;
    cumulativeCount = Math.max(0,cumulativeCount-removedCount);
    setHangerMessage(`${activeHanger.hanger_number}번 행거를 초기화했습니다.`,false);
    broadcastHangerChange('hanger-reset');
  });
}

async function resetAllHistory(){
  if(cumulativeCount === 0) return;
  const confirmed = await requestConfirmation({
    title:'전체 초기화',
    message:`지금까지 스캔한 바코드 ${cumulativeCount}건과 모든 행거 기록을 삭제할까요? 저장된 사진과 촬영 완료 상태는 유지되며 1번 행거부터 다시 시작합니다.`,
    actionLabel:'전체 초기화',
    danger:true
  });
  if(!confirmed) return;
  await runHangerAction(async()=>{
    hangerReady = false;
    activeHanger = null;
    scanInput.disabled = true;
    renderControls();
    try{
      const { error } = await supabase
        .from('scan_hangers')
        .delete()
        .eq('device_id',DEVICE_ID);
      if(error) throw error;

      await loadHangerState();
      hangerReady = true;
      connectionError.classList.remove('show');
      setHangerMessage('전체 스캔 기록을 초기화하고 1번 행거를 시작합니다.',false);
      broadcastHangerChange('full-reset');
    }catch(error){
      activeHanger = null;
      hangerReady = false;
      connectionErrorText.textContent = '전체 초기화 후 새 행거를 연결하지 못했습니다. 다시 연결해주세요.';
      connectionError.classList.add('show');
      throw new Error('전체 초기화 후 행거 연결이 완료되지 않아 스캔을 잠갔습니다.');
    }
  });
}

async function completeCurrentHanger(){
  if(!activeHanger || currentHangerCount === 0) return;
  const confirmed = await requestConfirmation({
    title:`${activeHanger.hanger_number}번 행거 완료`,
    message:`현재 행거 ${currentHangerCount}벌을 완료하고 다음 행거로 넘어갈까요?`,
    actionLabel:'완료 후 다음 행거'
  });
  if(!confirmed) return;
  await runHangerAction(async()=>{
    const completedNumber = activeHanger.hanger_number;
    const completedAt = new Date().toISOString();
    const { error } = await supabase
      .from('scan_hangers')
      .update({status:'completed',completed_at:completedAt})
      .eq('id',activeHanger.id)
      .eq('device_id',DEVICE_ID)
      .eq('status','active');
    if(error) throw error;
    hangerReady = false;
    await loadHangerState();
    hangerReady = true;
    setHangerMessage(`${completedNumber}번 행거 완료 · ${nextHangerNumber}번 행거를 시작합니다.`,false);
    broadcastHangerChange('hanger-completed');
  });
}

async function savePhoto(){
  if(isSaving || !currentFile || !currentTarget) return;
  isSaving = true;
  setModalButtonsDisabled(true);
  setSaveStatus('사진을 테스트 서버에 저장하고 있습니다.',false);

  const mimeType = resolveMimeType(currentFile);
  const extension = extensionForMimeType(mimeType);
  const uniqueId = crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const storagePath = currentStoragePath || `${currentTarget.barcode}/${new Date().toISOString().replace(/[:.]/g,'-')}-${uniqueId}.${extension}`;

  try{
    if(!currentStoragePath){
      const { error: uploadError } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(storagePath,currentFile,{cacheControl:'3600',contentType:mimeType,upsert:false});
      if(uploadError) throw new Error(`사진 업로드 실패: ${uploadError.message}`);
      currentStoragePath = storagePath;
    }

    if(!currentPhotoRecordSaved){
      const { error: insertError } = await supabase.from('item_photos').insert({
        barcode:currentTarget.barcode,
        target_id:currentTarget.id,
        storage_path:currentStoragePath,
        device_info:navigator.userAgent.slice(0,500),
        hanger_scan_id:currentHangerScanId,
        device_id:DEVICE_ID
      });
      if(insertError) throw new Error(`사진 기록 저장 실패: ${insertError.message}`);
      currentPhotoRecordSaved = true;
    }

    const completedAt = new Date().toISOString();
    const { data: updated, error: updateError } = await supabase
      .from('photo_targets')
      .update({status:'completed',completed_at:completedAt})
      .eq('id',currentTarget.id)
      .eq('status','pending')
      .select('id,status,completed_at')
      .maybeSingle();
    if(updateError) throw new Error(`작업 완료 처리 실패: ${updateError.message}`);

    const { error: hangerScanError } = await supabase
      .from('hanger_scans')
      .update({photo_saved:true})
      .eq('id',currentHangerScanId)
      .eq('device_id',DEVICE_ID);
    if(hangerScanError) throw new Error(`행거 촬영 상태 반영 실패: ${hangerScanError.message}`);

    const latestTarget = updated || {...currentTarget,status:'completed',completed_at:completedAt};
    targets.set(currentTarget.barcode,latestTarget);
    const match = logs.find(item=>item.id===currentHangerScanId);
    if(match && !match.photo){
      match.photo = true;
      currentPhotoCount += 1;
    }
    render();
    setSaveStatus('저장 완료',false);
    vibrate([60,40,60]);
    setTimeout(()=>closeModal(),350);
  }catch(error){
    console.error('Failed to save photo',error);
    const match = logs.find(item=>item.barcode===currentTarget?.barcode && item.isTarget && !item.photo);
    if(match) match.error = true;
    render();
    setSaveStatus(error.message || '저장에 실패했습니다. 다시 시도해주세요.',true);
  }finally{
    isSaving = false;
    setModalButtonsDisabled(false);
  }
}

async function fetchPagedRows(queryFactory){
  const allRows = [];
  for(let from = 0; ; from += PAGE_SIZE){
    const { data, error } = await queryFactory(from,from + PAGE_SIZE - 1);
    if(error) throw error;
    allRows.push(...data);
    if(data.length < PAGE_SIZE) break;
  }
  return allRows;
}

async function loadExcelJs(){
  if(!excelJsPromise) excelJsPromise = import(EXCELJS_MODULE_URL);
  const module = await excelJsPromise;
  const ExcelJS = module.default || module;
  if(!ExcelJS.Workbook) throw new Error('엑셀 생성 모듈을 불러오지 못했습니다.');
  return ExcelJS;
}

function publicPhotoUrl(storagePath){
  if(!storagePath) return '';
  return supabase.storage.from(STORAGE_BUCKET).getPublicUrl(storagePath).data.publicUrl;
}

const EXCEL_BODY_FONT = {name:'Malgun Gothic',size:10,bold:false,color:{argb:'FF000000'}};
const EXCEL_HEADER_FONT = {name:'Malgun Gothic',size:10,bold:true,color:{argb:'FF000000'}};

function applyWorksheetTypography(worksheet,boldAddresses=[]){
  const boldCells = new Set(boldAddresses);
  worksheet.eachRow({includeEmpty:true},row=>{
    row.eachCell({includeEmpty:true},cell=>{
      cell.font = {...(boldCells.has(cell.address) ? EXCEL_HEADER_FONT : EXCEL_BODY_FONT),underline:Boolean(cell.hyperlink)};
    });
  });
}

function styleWorksheetHeader(worksheet){
  applyWorksheetTypography(worksheet);
  const header = worksheet.getRow(1);
  header.height = 20;
  header.font = EXCEL_HEADER_FONT;
  header.alignment = {vertical:'middle',horizontal:'center'};
  header.eachCell(cell=>{
    cell.border = {bottom:{style:'thin',color:{argb:'FFBFBFBF'}}};
  });
  worksheet.views = [{state:'frozen',ySplit:1}];
  worksheet.autoFilter = {from:'A1',to:worksheet.getRow(1).getCell(worksheet.columnCount).address};
}

function writeHyperlink(cell,url){
  if(!url) return;
  cell.value = {text:'원본 열기',hyperlink:url};
  cell.font = {...EXCEL_BODY_FONT,underline:true};
}

async function buildResultsWorkbook({hangers,scans,photos}){
  const ExcelJS = await loadExcelJs();
  const workbook = new ExcelJS.Workbook();
  workbook.creator = '작업 바코드 스캐너';
  workbook.created = new Date();

  const hangerById = new Map(hangers.map(item=>[item.id,item]));
  const targetById = new Map([...targets.values()].map(item=>[item.id,item]));
  const photoByScanId = new Map();
  const photoByBarcode = new Map();
  for(const photo of photos){
    if(photo.hanger_scan_id) photoByScanId.set(photo.hanger_scan_id,photo);
    photoByBarcode.set(normalizeBarcode(photo.barcode),photo);
  }

  const summary = workbook.addWorksheet('요약');
  const scanSheet = workbook.addWorksheet('전체 스캔',{properties:{defaultRowHeight:19}});
  scanSheet.columns = [
    {header:'순번',key:'number',width:8},
    {header:'행거 번호',key:'hangerNumber',width:11},
    {header:'행거 상태',key:'hangerStatus',width:12},
    {header:'바코드',key:'barcode',width:20},
    {header:'Target Barcode',key:'isTarget',width:16},
    {header:'Target ID',key:'targetId',width:11},
    {header:'Target 상태',key:'targetStatus',width:13},
    {header:'사진 저장',key:'photoSaved',width:11},
    {header:'스캔 시간 (KST)',key:'scannedAt',width:21},
    {header:'행거 완료 (KST)',key:'hangerCompletedAt',width:21},
    {header:'Target 완료 (KST)',key:'targetCompletedAt',width:21},
    {header:'원본 이미지',key:'originalImage',width:14},
    {header:'Storage 경로',key:'storagePath',width:42},
    {header:'Target 메모',key:'targetNote',width:24}
  ];

  scans.forEach((scan,index)=>{
    const hanger = hangerById.get(scan.hanger_id) || {};
    const target = targetById.get(scan.target_id) || targets.get(normalizeBarcode(scan.barcode)) || null;
    const photo = photoByScanId.get(scan.id) || photoByBarcode.get(normalizeBarcode(scan.barcode)) || null;
    const row = scanSheet.addRow({
      number:index + 1,
      hangerNumber:hanger.hanger_number ?? null,
      hangerStatus:hanger.status === 'completed' ? '완료' : '진행 중',
      barcode:scan.barcode,
      isTarget:scan.is_target ? 'Y' : 'N',
      targetId:target?.id ?? null,
      targetStatus:target?.status ?? null,
      photoSaved:photo ? 'Y' : 'N',
      scannedAt:toKstExcelDate(scan.scanned_at),
      hangerCompletedAt:toKstExcelDate(hanger.completed_at),
      targetCompletedAt:toKstExcelDate(target?.completed_at),
      storagePath:photo?.storage_path ?? null,
      targetNote:target?.note ?? null
    });
    for(const column of [9,10,11]) row.getCell(column).numFmt = 'yyyy-mm-dd hh:mm:ss';
    writeHyperlink(row.getCell(12),publicPhotoUrl(photo?.storage_path));
  });
  styleWorksheetHeader(scanSheet);

  const photoSheet = workbook.addWorksheet('촬영 결과',{properties:{defaultRowHeight:19}});
  photoSheet.columns = [
    {header:'사진 ID',key:'photoId',width:10},
    {header:'바코드',key:'barcode',width:20},
    {header:'Target ID',key:'targetId',width:11},
    {header:'Target 상태',key:'targetStatus',width:13},
    {header:'Target 메모',key:'targetNote',width:24},
    {header:'사진 저장 시간 (KST)',key:'createdAt',width:23},
    {header:'Target 완료 (KST)',key:'completedAt',width:21},
    {header:'행거 번호',key:'hangerNumber',width:11},
    {header:'스캔 시간 (KST)',key:'scannedAt',width:21},
    {header:'원본 이미지',key:'originalImage',width:14},
    {header:'Storage 경로',key:'storagePath',width:42}
  ];

  photos.forEach(photo=>{
    const target = targetById.get(photo.target_id) || targets.get(normalizeBarcode(photo.barcode)) || null;
    const scan = scans.find(item=>item.id === photo.hanger_scan_id) || scans.find(item=>normalizeBarcode(item.barcode) === normalizeBarcode(photo.barcode));
    const hanger = scan ? hangerById.get(scan.hanger_id) || {} : {};
    const row = photoSheet.addRow({
      photoId:photo.id,
      barcode:photo.barcode,
      targetId:target?.id ?? photo.target_id ?? null,
      targetStatus:target?.status ?? null,
      targetNote:target?.note ?? null,
      createdAt:toKstExcelDate(photo.created_at),
      completedAt:toKstExcelDate(target?.completed_at),
      hangerNumber:hanger.hanger_number ?? null,
      scannedAt:toKstExcelDate(scan?.scanned_at),
      storagePath:photo.storage_path
    });
    for(const column of [6,7,9]) row.getCell(column).numFmt = 'yyyy-mm-dd hh:mm:ss';
    writeHyperlink(row.getCell(10),publicPhotoUrl(photo.storage_path));
  });
  styleWorksheetHeader(photoSheet);

  summary.getCell('A1').value = '작업 바코드 스캔 결과';
  summary.getCell('A1').alignment = {vertical:'middle'};
  summary.getRow(1).height = 20;
  summary.getColumn('A').width = 24;
  summary.getColumn('B').width = 24;
  const maxScanRow = Math.max(2,scans.length + 1);
  summary.getCell('A3').value = '전체 스캔';
  summary.getCell('B3').value = {formula:`COUNTA('전체 스캔'!A2:A${maxScanRow})`,result:scans.length};
  summary.getCell('A4').value = 'Target Barcode';
  summary.getCell('B4').value = {formula:`COUNTIF('전체 스캔'!E2:E${maxScanRow},"Y")`,result:scans.filter(item=>item.is_target).length};
  summary.getCell('A5').value = '촬영 완료';
  summary.getCell('B5').value = {formula:`COUNTA('촬영 결과'!A2:A${Math.max(2,photos.length + 1)})`,result:photos.length};
  summary.getCell('A7').value = '다운로드 시간 (KST)';
  summary.getCell('B7').value = toKstExcelDate(new Date());
  summary.getCell('B7').numFmt = 'yyyy-mm-dd hh:mm:ss';
  summary.getCell('A9').value = '원본 이미지는 각 결과 시트의 “원본 열기” 링크로 확인할 수 있습니다.';
  summary.mergeCells('A9:D9');
  applyWorksheetTypography(summary,['A1','A3','A4','A5','A7']);
  summary.views = [{state:'frozen',ySplit:1}];
  return workbook;
}

async function downloadResultsExcel(){
  if(isExporting || cumulativeCount === 0) return;
  isExporting = true;
  scanInput.disabled = true;
  setExportStatus('결과 데이터를 불러오고 있습니다.',false);
  renderControls();
  try{
    const [hangers,scans,allPhotos] = await Promise.all([
      fetchPagedRows((from,to)=>supabase.from('scan_hangers').select('id,hanger_number,status,created_at,completed_at,completed_at_kst').eq('device_id',DEVICE_ID).order('hanger_number',{ascending:true}).range(from,to)),
      fetchPagedRows((from,to)=>supabase.from('hanger_scans').select('id,hanger_id,device_id,barcode,target_id,is_target,photo_saved,scanned_at,scanned_at_kst').eq('device_id',DEVICE_ID).order('id',{ascending:true}).range(from,to)),
      fetchPagedRows((from,to)=>supabase.from('item_photos').select('id,barcode,target_id,storage_path,created_at,created_at_kst,hanger_scan_id,device_id').order('id',{ascending:true}).range(from,to))
    ]);
    if(!scans.length) throw new Error('다운로드할 스캔 기록이 없습니다.');
    const scannedBarcodes = new Set(scans.map(item=>normalizeBarcode(item.barcode)));
    const photos = allPhotos.filter(item=>item.device_id === DEVICE_ID || scannedBarcodes.has(normalizeBarcode(item.barcode)));
    setExportStatus('엑셀 파일을 생성하고 있습니다.',false);
    const workbook = await buildResultsWorkbook({hangers,scans,photos});
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const fileDate = formatKstFileDate();
    link.href = url;
    link.download = `바코드_사진작업_결과_${fileDate}.xlsx`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    setExportStatus(`엑셀 다운로드 완료 · 스캔 ${scans.length.toLocaleString()}건`,false);
  }catch(error){
    console.error('Failed to export results',error);
    setExportStatus(error.message || '엑셀 파일 생성에 실패했습니다.',true);
  }finally{
    isExporting = false;
    scanInput.disabled = !appReady();
    renderControls();
    refocus();
  }
}

function setExportStatus(message,isError){
  exportResultStatus.textContent = message;
  exportResultStatus.className = `result-export-status${message?' show':''}${isError?' error':''}`;
}

function resolveMimeType(file){
  const allowed = new Set(['image/jpeg','image/png','image/webp','image/heic','image/heif']);
  if(allowed.has(file.type)) return file.type;
  const ext = file.name.split('.').pop()?.toLowerCase();
  return ({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'})[ext] || null;
}
function extensionForMimeType(mimeType){ return ({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif'})[mimeType] || 'jpg'; }
function setModalButtonsDisabled(disabled){ saveBtn.disabled=disabled;retakeBtn.disabled=disabled||Boolean(currentStoragePath);laterBtn.disabled=disabled;cameraBtn.disabled=disabled;saveBtn.textContent=disabled?'저장 중…':'저장';renderControls(); }
function setSaveStatus(message,isError){ saveStatus.textContent=message;saveStatus.className=`save-status${message?' show':''}${isError?' error':''}`; }
function setHangerMessage(message,isError){ hangerMessage.textContent=message;hangerMessage.className=`hanger-message${message?' show':''}${isError?' error':''}`; }
function releasePreviewUrl(){ if(previewUrl){ URL.revokeObjectURL(previewUrl);previewUrl=null; } }

function closeModal(){
  if(isSaving) return;
  targetModal.classList.remove('show');
  beforePhoto.style.display = 'flex';
  previewBox.classList.remove('show');
  releasePreviewUrl();
  previewImg.removeAttribute('src');
  cameraInput.value = '';
  currentTarget = null;
  currentHangerScanId = null;
  currentFile = null;
  currentStoragePath = null;
  currentPhotoRecordSaved = false;
  setSaveStatus('',false);
  scanInput.disabled = !appReady();
  renderControls();
  refocus();
  setTimeout(()=>flushPendingHangerSync(),0);
}

function render(){
  $('hangerBadge').textContent = `${activeHanger?.hanger_number || nextHangerNumber}번 행거`;
  $('currentHangerCount').textContent = currentHangerCount.toLocaleString();
  $('cumulativeCount').textContent = cumulativeCount.toLocaleString();
  $('totalCount').textContent = cumulativeCount.toLocaleString();
  $('targetCount').textContent = currentTargetCount.toLocaleString();
  $('photoCount').textContent = currentPhotoCount.toLocaleString();
  $('lastCode').textContent = logs[0]?.barcode || '-';
  if(!logs.length){
    rows.innerHTML='<div class="empty">현재 행거에 아직 스캔 기록이 없습니다.</div>';
  }else{
    rows.innerHTML = logs.slice(0,30).map(item=>{
      const label=item.error?'저장오류':item.photo?'촬영완료':item.isTarget?'작업대상':'정상';
      const tagClass=item.error?'error':item.photo?'done':item.isTarget?'target':'normal';
      return `<div class="row"><div><div class="code">${escapeHtml(item.barcode)}</div><div class="time">${item.time}</div></div><div class="tag ${tagClass}">${label}</div></div>`;
    }).join('');
  }
  renderControls();
}

function renderControls(){
  const locked = !targetListReady || !hangerReady || isHangerBusy || isRecordingScan || isSaving || isSyncingHanger || isExporting || targetModal.classList.contains('show') || confirmModal.classList.contains('show');
  deleteScanBtn.disabled = locked || currentHangerCount === 0;
  resetHangerBtn.disabled = locked || currentHangerCount === 0;
  completeHangerBtn.disabled = locked || currentHangerCount === 0;
  exportResultBtn.disabled = locked || cumulativeCount === 0;
  fullResetBtn.disabled = locked || cumulativeCount === 0;
}
function escapeHtml(value){ return value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }

function receiveHangerSync(event){
  if(!shouldAcceptHangerSync(event)) return;
  pendingHangerSync = true;
  flushPendingHangerSync();
}

if(hangerSyncChannel){
  hangerSyncChannel.addEventListener('message',event=>receiveHangerSync(event.data));
}else{
  window.addEventListener('storage',event=>{
    if(event.key !== HANGER_SYNC_STORAGE_KEY || !event.newValue) return;
    try{ receiveHangerSync(JSON.parse(event.newValue)); }catch(_error){ /* 잘못된 동기화 이벤트 무시 */ }
  });
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  synchronizeHangerState({message:'변경된 행거 정보를 다시 연결했습니다.',onlyWhenChanged:true});
});
window.addEventListener('beforeunload',()=>{
  releasePreviewUrl();
  hangerSyncChannel?.close();
});
loadAppState();
</script>
